<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلم زبان من</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #131f24; --panel: #202f36; --primary: #58cc02; --text: #ffffff; --text-gray: #afafaf; }
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        /* هدر و تنظیمات */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select, input[type="file"] { width: 100%; padding: 12px; border-radius: 12px; background: var(--panel); color: white; border: 2px solid #37464f; margin-top: 10px; font-size: 14px; outline: none; }
        
        /* تب‌ها (صفحات برنامه) */
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* بخش کلمات و فونتیک (سبک دولینگو) */
        .teaching-box { background: var(--panel); padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; border: 2px solid #37464f; }
        .word-box { display: inline-flex; flex-direction: column; align-items: center; margin: 5px 8px; cursor: pointer; transition: 0.2s; }
        .word-box:hover { transform: scale(1.1); color: var(--primary); }
        .en-word { font-size: 22px; font-weight: bold; font-family: Tahoma, sans-serif; }
        .ipa { font-size: 13px; color: var(--text-gray); font-family: Arial, sans-serif; }

        /* دکمه میکروفون */
        .mic-container { text-align: center; margin-top: 30px; }
        .mic-btn { background: var(--primary); width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 6px 0 #58a700; transition: 0.1s; color: white;}
        .mic-btn:active { transform: translateY(6px); box-shadow: none; }
        .status-text { margin-top: 15px; font-size: 14px; color: var(--primary); font-weight: bold; }

        /* فلش‌کارت‌ها */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: var(--panel); border-radius: 16px; padding: 15px; text-align: center; border: 2px solid #37464f; }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }

        /* منوی پایین گوشی */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #37464f; z-index: 100; }
        .nav-item { color: var(--text-gray); cursor: pointer; font-size: 14px; font-weight: bold; text-align: center; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="tab-learn" class="tab-content active">
        <div class="header"><h2>تمرین روزانه 🎯</h2></div>
        
        <div class="teaching-box" id="teachingBox">
            <p style="color: #afafaf; font-size: 14px;">برای شروع، روی میکروفون کلیک کن یا یک فایل در بخش تنظیمات آپلود کن.</p>
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn">🎙️</button>
            <div class="status-text" id="statusText">آماده شنیدن...</div>
        </div>
    </div>

    <div id="tab-flashcards" class="tab-content">
        <div class="header"><h2>فلش‌کارت‌های من 🗂️</h2></div>
        <div class="grid" id="flashcardsGrid"></div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="header"><h2>مسیر و فایل‌ها ⚙️</h2></div>
        
        <label>مسیر یادگیری شما:</label>
        <select id="pathSelect">
            <option value="Daily Conversation & Travel">سفر و مکالمات روزمره</option>
            <option value="Civil Engineering & Architecture">مهندسی عمران و معماری</option>
            <option value="IELTS Exam">آزمون آیلتس</option>
        </select>

        <label style="margin-top: 20px; display: block;">آپلود جزوه یا کتاب (PDF/عکس):</label>
        <input type="file" id="fileInput" accept=".pdf, image/*">
        <p style="font-size: 12px; color: var(--text-gray);">فایل شما مستقیماً توسط هوش مصنوعی خوانده شده و برای تمرین استفاده می‌شود.</p>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('learn', this)">آموزش 🎓</div>
    <div class="nav-item" onclick="switchTab('flashcards', this)">کارت‌ها 🗂️</div>
    <div class="nav-item" onclick="switchTab('settings', this)">تنظیمات ⚙️</div>
</div>

<script src="app.js"></script>
</body>
</html>
