<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اپلیکیشن زبان</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Tahoma; background: #2c3e50; color: white; padding: 20px; }
        .tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { background: #34495e; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: #3498db; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h1, h2, h3 { color: white !important; }
    </style>
</head>
<body>
    <h1>دستیار هوشمند زبان</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('mic')">🎤 میکروفون</button>
        <button class="tab-btn" onclick="showTab('conv')">🗣️ مکالمه</button>
        <button class="tab-btn" onclick="showTab('exam')">📝 آزمون</button>
        <button class="tab-btn" onclick="showTab('lib')">📚 کتاب/موزیک</button>
    </div>

    <div id="mic" class="tab-content active">
        <button onclick="toggleRecording()">🔴 ضبط/تحلیل</button>
        <div id="dictSection">
            <h3>دیکشنری</h3>
            <input type="text" id="wordInput" placeholder="کلمه را وارد کنید">
            <button onclick="lookupWord()">جستجو</button>
        </div>
    </div>

    <div id="conv" class="tab-content">
        <div id="chatWindow" style="height: 300px; overflow-y: scroll;"></div>
        <input type="text" id="chatInput" placeholder="پیام خود را بنویسید...">
        <button onclick="sendChatMessage()">ارسال</button>
    </div>

    <div id="exam" class="tab-content">
        <button onclick="startExam()">شروع آزمون روزانه</button>
        <div id="examArea"></div>
    </div>

    <div id="lib" class="tab-content">
        <div id="contentList"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
