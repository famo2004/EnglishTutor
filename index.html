<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلم زبان من</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma; padding: 20px; }
        .mic-btn { background: #3b82f6; border: none; border-radius: 50%; width: 70px; height: 70px; font-size: 30px; cursor: pointer; color: white;}
        .card { background: #1e293b; border-radius: 15px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #334155; position: relative;}
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        .badge { position: absolute; top: 10px; right: 10px; background: #10b981; padding: 3px 8px; border-radius: 10px; font-size: 12px; }
        .badge.idiom { background: #f59e0b; }
        .badge.grammar { background: #8b5cf6; }
        .badge.proverb { background: #ef4444; }
        .add-manual { background: #334155; padding: 15px; border-radius: 10px; margin-top: 20px; }
        input, select { width: 90%; padding: 8px; margin: 5px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #38bdf8;">معلم زبان هوشمند من</h2>
    
    <div style="text-align: center; margin: 20px 0;">
        <p class="status">آماده صحبت... 🎤</p>
        <button class="mic-btn">🎙️</button>
    </div>

    <h3>فلش‌کارت‌های ذخیره شده:</h3>
    <div id="flashcardsContainer"></div>

    <div class="add-manual">
        <h4>➕ اضافه کردن دستی فلش‌کارت</h4>
        <select id="manualCategory">
            <option value="word">کلمه</option>
            <option value="idiom">اصطلاح</option>
            <option value="grammar">گرامر</option>
            <option value="proverb">ضرب‌المثل</option>
        </select>
        <input type="text" id="manualFront" placeholder="کلمه یا اصطلاح انگلیسی...">
        <input type="text" id="manualBack" placeholder="معنی فارسی...">
        <button id="saveManualBtn" style="background:#10b981; color:white; padding:8px; border:none; border-radius:5px; width:100%; margin-top:10px;">ذخیره کارت</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
