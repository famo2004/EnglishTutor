<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلم زبان من</title>
<link rel="manifest" href="manifest.json">
    <style>
        /* تم دارک و شیشه‌ای (Glassmorphism) شبیه کلاینت‌های مدرن */
        body {
            margin: 0;
            padding: 0;
            /* پس‌زمینه تیره با گرادیانت ملایم */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: Tahoma, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* پنل اصلی برنامه‌ (حالت شیشه‌ای تار شده) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); /* افکت تاری پس‌زمینه */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            /* متن با رنگ‌های نئونی */
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            color: #10b981; /* رنگ سبز روشن برای وضعیت */
            font-size: 13px;
            margin-bottom: 40px;
            background: rgba(16, 185, 129, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* دکمه ضبط صدا با افکت درخشش */
        .mic-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            border: none;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 35px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            transition: all 0.3s ease;
        }

        .mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.8);
        }

        /* جایگاه فلش‌کارت‌ها در پایین صفحه */
        .card-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .english-word {
            font-size: 24px;
            font-weight: bold;
            color: #f8fafc;
            letter-spacing: 1px;
            display: block;
        }

        .phonetic {
            font-size: 12px;
            color: #64748b; /* رنگ کمرنگ برای تلفظ */
            margin-top: 5px;
        }

        .persian-meaning {
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>معلم زبان من</h1>
        <div class="status">متصل به هوش مصنوعی ⚡</div>
        
        <div>
            <button class="mic-btn">🎤</button>
        </div>
        
        <div class="card-container">
            <span class="english-word">Vocabulary</span>
            <div class="phonetic">/vəˈkæbjəˌlɛri/</div>
            <div class="persian-meaning">دایره لغات</div>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
